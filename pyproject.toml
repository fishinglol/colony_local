[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-local"
version = "0.1.0"
description = "Multi-AI assistant with shared context — runs on your machine."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "certifi",  # SSL certs on macOS
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
colony = "colony.cli:main"

[tool.setuptools.packages.find]
include = ["colony*"]

[tool.setuptools.package-data]
colony = ["web/*", "web/js/*", "engine/colony-gate/*"]
