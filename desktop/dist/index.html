<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colony</title>
<style>
  html, body { height: 100%; margin: 0; background: #050507; color: #fff;
               font-family: -apple-system, 'Inter', sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .mark { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, #8b5cf6, #22d3ee);
          animation: pulse 1.4s ease-in-out infinite; }
  #msg { font-size: 14px; color: rgba(255,255,255,0.6); max-width: 460px; text-align: center; line-height: 1.6; }
  body.failed .mark { animation: none; opacity: .4; }
  body.failed #msg { color: #f87171; }
  @keyframes pulse { 50% { transform: scale(0.92); opacity: .7; } }
</style>
</head>
<body>
  <div class="mark"></div>
  <div id="msg">Starting Colony…</div>
</body>
</html>
